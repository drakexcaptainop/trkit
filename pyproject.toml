[project]
name = "briefkit"
version = "0.1.0"
description = "Local MCP servers that let an agent produce a cited research brief for a US stock or ETF."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4",
    "pandas>=2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "arch>=7",
    "httpx>=0.27",
    "trafilatura>=2",
    "feedparser>=6",
    "ollama>=0.4",
]

[project.optional-dependencies]
foundation = [
    "chronos-forecasting>=2",
    "torch>=2.3",
]

[project.scripts]
briefkit-marketdata = "briefkit.marketdata.server:main"
briefkit-forecast = "briefkit.forecast.server:main"
briefkit-news = "briefkit.news.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
